test:
  name: "Signup with generated data"
  description: "Built-in functions for independent account data"
  version: "1.0"

variables:
  base_url: "https://api.example.com"
  signing_secret: ""

http_defaults:
  base_url: "{{base_url}}"
  timeout: "15s"
  headers:
    Accept: "application/json"

scenarios:
  - name: "Signup"
    load:
      type: constant
      users: 10
      duration: 5m
      ramp_up: 15s
    steps:
      - request:
          name: "Create account"
          method: POST
          url: /api/signup
          headers:
            X-Request-Id: "{{_uuid()}}"
            X-Signature: "{{_hmacSha256({{_concat(\"signup-\",{{_timestamp()}})}},{{signing_secret}})}}"
          body:
            email: "user-{{_uuid()}}@example.com"
            password: "{{_randomAlphanumeric(16)}}"
            display_name: "{{_titleCase({{_randomFrom(\"ada lovelace\",\"grace hopper\",\"alan turing\")}})}}"
            plan: "{{_randomFrom(\"free\",\"pro\",\"team\")}}"
            signup_date: "{{_time(\"yyyy-MM-dd\")}}"
            trial_ends: "{{_addTime({{_time(\"yyyy-MM-dd\")}},14,\"day\",\"yyyy-MM-dd\")}}"
          extractors:
            - type: jsonpath
              from: body
              var: account_id
              path: $.data.id
              default: ""
          assertions:
            - type: status
              value: 201
            - type: jsonpath
              path: $.data.id

      - think_time:
          min: 1s
          max: 3s
          distribution: uniform

      - request:
          name: "Fetch account"
          method: GET
          url: "/api/accounts/{{account_id}}"
          assertions:
            - type: status
              value: 200
            - type: response_time_ms
              max_ms: 800
