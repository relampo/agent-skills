test:
  name: "CSV-driven login smoke"
  description: "Process-shared synthetic credentials with status assertion"
  version: "1.0"

variables:
  base_url: "https://api.example.com"

data_source:
  type: csv
  file: "users.csv"
  mode: shared
  strategy: sequential
  variable_names: "email,password"
  on_exhausted: recycle

http_defaults:
  base_url: "{{base_url}}"
  timeout: "15s"
  headers:
    Accept: "application/json"

scenarios:
  - name: "Login"
    load:
      type: constant
      users: 5
      duration: 2m
      ramp_up: 10s
    steps:
      - request:
          name: "Login"
          method: POST
          url: /api/login
          body:
            email: "{{email}}"
            password: "{{password}}"
          extractors:
            - type: jsonpath
              from: body
              var: access_token
              path: $.token
              default: ""
          assertions:
            - type: status
              value: 200

      - request:
          name: "Profile"
          method: GET
          url: /api/me
          headers:
            Authorization: "Bearer {{access_token}}"
          assertions:
            - type: status
              value: 200
